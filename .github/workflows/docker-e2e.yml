name: Docker E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run clean-room PulseGuard E2E
        shell: pwsh
        run: |
          ./scripts/test-pulseguard-public-release-e2e.ps1 `
            -ProjectRoot $PWD `
            -ConfirmDataLoss `
            -CleanAfterTest

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulseguard-e2e-failure
          path: ~/Downloads/PulseGuard-E2E-failure-*.zip
          if-no-files-found: ignore
          retention-days: 7
